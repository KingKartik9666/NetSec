[package]
name = "netsec-runtime"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
netsec-core = { path = "../core" }
netsec-models = { path = "../models" }
netsec-explain = { path = "../explain" }
netsec-capture = { package = "netsec-capture-spike", path = "../../../spikes/capture" }
netsec-xgboost-spike = { path = "../../../spikes/xgboost" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
libloading = "=0.8.6"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

