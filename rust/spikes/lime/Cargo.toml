[package]
name = "netsec-lime-spike"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false

[dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
rand = "=0.8.5"
rand_chacha = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
statrs = { version = "=0.18.0", default-features = false }
thiserror = "2"
netsec-xgboost-spike = { path = "../xgboost" }

[profile.release]
panic = "unwind"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
